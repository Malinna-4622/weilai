name: 🌱 未来 · 每日自动巡检

on:
  schedule:
    # 每天北京时间 8:00（UTC 0:00）运行
    - cron: '0 0 * * *'
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: 巡检各官网+更新公告数据
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install cheerio node-fetch 2>/dev/null || true
        working-directory: ./scripts

      - name: 运行抓取脚本
        run: node scripts/scrape.js
        continue-on-error: true

      - name: 提交更新数据
        run: |
          git config user.name "未来Bot"
          git config user.email "weilai-bot@users.noreply.github.com"
          git add scripts/data/announcements.json scripts/data/history.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "🌱 每日自动巡检 $(date '+%Y-%m-%d %H:%M')"
          git push
